name: data pipeline

on:
  # The 2026 cycle is archived (ARCHIVED in src/lib/election.ts), so there's no schedule. For a
  # live cycle add one back, offset from :00/:15/:30/:45 where GitHub drops the most runs:
  #   schedule:
  #     - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      steps:
        description: "steps to run (discover prices polls pollsters attention results lock scores | all)"
        default: "all"

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm pipeline ${{ inputs.steps || 'all' }}
